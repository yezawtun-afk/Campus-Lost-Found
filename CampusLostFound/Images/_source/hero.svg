<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A2C"/>
      <stop offset="0.55" stop-color="#0E2740"/>
      <stop offset="1" stop-color="#17405F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B57" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6B57" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB3A6"/>
      <stop offset="1" stop-color="#FF6B57"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- warm sunset glow behind the campus -->
  <circle cx="1180" cy="300" r="430" fill="url(#glow)"/>
  <circle cx="1180" cy="300" r="140" fill="url(#sun)" opacity="0.9"/>
  <circle cx="1180" cy="300" r="230" fill="none" stroke="#FF6B57" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="1180" cy="300" r="300" fill="none" stroke="#FF6B57" stroke-opacity="0.14" stroke-width="2"/>

  <!-- distant hills -->
  <path d="M0 700 Q300 620 560 690 T1120 660 T1600 700 V900 H0 Z" fill="#0A1F33" opacity="0.65"/>

  <!-- campus building silhouettes -->
  <g fill="#08192A">
    <!-- left low block -->
    <rect x="700" y="620" width="300" height="280"/>
    <!-- main tower -->
    <rect x="1010" y="520" width="210" height="380"/>
    <rect x="1070" y="462" width="90" height="70" rx="8"/>
    <path d="M1090 462 L1115 420 L1140 462 Z"/>
    <circle cx="1115" cy="560" r="34" fill="#FFF8EF" opacity="0.16"/>
    <circle cx="1115" cy="560" r="34" fill="none" stroke="#FFB3A6" stroke-opacity="0.5" stroke-width="4"/>
    <circle cx="1115" cy="560" r="4" fill="#FFB3A6" opacity="0.8"/>
    <!-- right wing -->
    <rect x="1220" y="600" width="330" height="300"/>
    <rect x="1300" y="546" width="120" height="60" rx="6"/>
    <!-- far right block -->
    <rect x="1490" y="660" width="110" height="240"/>
  </g>

  <!-- lit windows -->
  <g fill="#FFC9B8" opacity="0.55">
    <rect x="730" y="660" width="26" height="34" rx="4"/><rect x="790" y="660" width="26" height="34" rx="4"/>
    <rect x="850" y="660" width="26" height="34" rx="4"/><rect x="910" y="660" width="26" height="34" rx="4"/>
    <rect x="730" y="726" width="26" height="34" rx="4"/><rect x="850" y="726" width="26" height="34" rx="4"/>
    <rect x="790" y="726" width="26" height="34" rx="4"/><rect x="910" y="726" width="26" height="34" rx="4"/>
    <rect x="1120" y="640" width="30" height="40" rx="4"/><rect x="1120" y="710" width="30" height="40" rx="4"/>
    <rect x="1120" y="780" width="30" height="40" rx="4"/>
    <rect x="1250" y="646" width="30" height="40" rx="4"/><rect x="1310" y="646" width="30" height="40" rx="4"/>
    <rect x="1440" y="646" width="30" height="40" rx="4"/><rect x="1250" y="716" width="30" height="40" rx="4"/>
    <rect x="1370" y="716" width="30" height="40" rx="4"/><rect x="1440" y="716" width="30" height="40" rx="4"/>
  </g>
  <g fill="#FF6B57" opacity="0.7">
    <rect x="790" y="786" width="30" height="40" rx="4"/>
    <rect x="1310" y="786" width="30" height="40" rx="4"/>
    <rect x="1510" y="700" width="24" height="30" rx="4"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="896" width="1600" height="4" fill="#FF6B57" opacity="0.4"/>

  <!-- floating "found item" cards over the sky -->
  <g opacity="0.95">
    <!-- location pin -->
    <g transform="translate(1330 210)">
      <circle cx="0" cy="0" r="74" fill="#FF6B57" opacity="0.14"/>
      <path d="M0 44 C0 44 34 8 34 -12 A34 34 0 1 0 -34 -12 C-34 8 0 44 0 44 Z" fill="#FF8A75"/>
      <circle cx="0" cy="-12" r="13" fill="#0A1F33" opacity="0.55"/>
    </g>

    <!-- id card -->
    <g transform="translate(890 300) rotate(-9)">
      <rect x="0" y="0" width="196" height="124" rx="14" fill="#FFF8EF" opacity="0.95"/>
      <rect x="0" y="0" width="196" height="34" rx="14" fill="#FF6B57"/>
      <rect x="0" y="22" width="196" height="12" fill="#FF6B57"/>
      <circle cx="42" cy="80" r="20" fill="#12314E" opacity="0.35"/>
      <rect x="76" y="66" width="90" height="10" rx="5" fill="#12314E" opacity="0.35"/>
      <rect x="76" y="86" width="64" height="8" rx="4" fill="#12314E" opacity="0.2"/>
    </g>

    <!-- keyring -->
    <g transform="translate(1230 470) rotate(14)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#E8DED0" stroke-opacity="0.8" stroke-width="8"/>
      <rect x="26" y="-6" width="96" height="12" rx="6" fill="#E8DED0" fill-opacity="0.8"/>
      <rect x="86" y="6" width="12" height="24" rx="5" fill="#E8DED0" fill-opacity="0.8"/>
      <rect x="106" y="6" width="12" height="32" rx="5" fill="#E8DED0" fill-opacity="0.8"/>
    </g>

    <!-- dotted route -->
    <path d="M690 470 C 830 400 900 520 1050 470" fill="none" stroke="#FFB3A6" stroke-width="3" stroke-dasharray="4 14" stroke-linecap="round" opacity="0.6"/>
    <circle cx="690" cy="470" r="7" fill="#FFB3A6" opacity="0.7"/>
  </g>

  <!-- soft vignette so page text stays readable on the left -->
  <rect width="1600" height="900" fill="url(#leftFade)" opacity="0"/>
  <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#071A2C" stop-opacity="0.96"/>
    <stop offset="0.5" stop-color="#071A2C" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#071A2C" stop-opacity="0"/>
  </linearGradient>
  <rect width="1000" height="900" fill="url(#leftFade)"/>
</svg>

